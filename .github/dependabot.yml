# Weekly update PRs for what this repo pins but does not write: the GitHub Actions in
# .github/workflows (pinned to full commit SHAs, which only a bot keeps current) and the npm
# toolchains at the root and in web/ (devDependencies only — the package ships none, ADR 0001).
# Grouped so each ecosystem opens at most one PR a week.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      root-dev:
        patterns: ["*"]
    # Majors are a migration, not a bump: TypeScript 7 turns `strict` on by default (#277), and
    # @types/node stays on the major of the Node floor (engines >=22.7) so it never types an API
    # the floor lacks.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
