name: publish

# Publish `geneseed` to npm using TRUSTED PUBLISHING (OIDC).
#
# There is no `NPM_TOKEN` in this repository and there is not meant to be one. The job
# mints a short-lived OIDC token from GitHub, npm exchanges it for a one-shot publish
# grant, and nothing long-lived is ever stored. Provenance is attested automatically as
# part of that exchange, so there is no `--provenance` flag here on purpose.
#
# ─────────────────────────────────────────────────────────────────────────────────────
# ⛔ THE ONE STEP THAT CANNOT BE REHEARSED LOCALLY — AND IT IS MANUAL, AND IT IS ONCE
# ─────────────────────────────────────────────────────────────────────────────────────
# npm has to be told that THIS repository and THIS workflow file are allowed to publish
# the package. Nothing in this repository can do it, and no local run can prove it was
# done: the first `npm publish` here either finds a configured trusted publisher or
# fails with an authentication error. Every other step in this file was exercised by a
# local `npm pack` + `npm install` (`tests/unit/package_manifest.test.mjs`); this one was
# not, and cannot be.
#
# ⚠ AND A DRY RUN DOES NOT REHEARSE IT EITHER. `npm publish --dry-run` packs the tarball and
# prints what it would upload; it never asks the registry for the publish grant, so it is green
# whether or not a trusted publisher exists. A green dry run proves the TARBALL — the file list,
# the version, the gates below — and says nothing at all about this paragraph.
#
# Do it once, signed in to npmjs.com as the account that owns `geneseed`:
#
#   npmjs.com → the package → Settings → Trusted publisher → GitHub Actions
#     Organization or user   Arylmera
#     Repository             Geneseed
#     Workflow filename      publish.yml      ← must equal THIS file's own name
#     Environment            (leave empty — this job declares no environment)
#
# or, from a terminal logged in with `npm login`:
#
#   npm trust github geneseed --file publish.yml --repo Arylmera/Geneseed
#
# ⚠ THE PACKAGE HAS NEVER BEEN PUBLISHED. A trusted publisher is configured on a
# package, and npm's UI reaches that screen through a package that exists. If the
# account's own "Trusted publishers" screen will not accept an unpublished name, the
# FIRST publish has to be done by hand from a logged-in terminal (`npm publish` at the
# repository root) and the trusted publisher configured immediately afterwards, from
# the package's Settings tab. Every publish after that runs from here.
#
# ⚠ RENAMING THIS FILE BREAKS PUBLISHING, SILENTLY. The trusted publisher is keyed on
# the workflow FILENAME. A renamed workflow still runs and still mints a token; npm just
# refuses it. `tests/unit/docs.test.mjs` — "the publish workflow references its own
# filename", one of the seven claims it makes about this file — fails when the filename
# named above stops matching the file it is written in, which is the only local symptom
# that exists.
#
# The trigger is MANUAL, deliberately: Actions → publish → Run workflow. There is no
# automatic trigger of any kind, and the gate above forbids adding one. Bump the version in
# `harness.config.json` first (`package.json` mirrors it and a fork fails
# `tests/unit/package_manifest.test.mjs`'s "version mirrors harness.config.json") —
# never with `npm version`, which edits only one of the two.
#
# ⚠ THE DEFAULT IS A DRY RUN, and that is the whole point of the switch: the dangerous path is
# the one you have to ask for. Leaving `dry_run` ticked runs every gate below and then
# `npm publish --dry-run`, which uploads nothing. Untick it — deliberately, once, having read
# the version you are about to burn — to publish for real. There is no way back after 72 hours.
#
#   gh workflow run publish.yml -f dry_run=true      # rehearse (the default)
#   gh workflow run publish.yml -f dry_run=false     # ⚠ THE REAL ONE

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rehearse: run every gate, then pack and report instead of uploading."
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # mints the OIDC token npm exchanges for the publish grant

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14.0. `engines` in package.json says
          # >=22.3.0 and that is a DIFFERENT number on purpose: it is the floor for
          # running geneseed, not for publishing it.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # The npm bundled with a setup-node image can predate 11.5.1, which is where
      # trusted publishing landed. Pin the floor rather than hope for it.
      - name: npm new enough for trusted publishing
        run: npm install -g npm@latest

      # `workflow_dispatch` can run against any ref, including one CI never saw, and a
      # published version cannot be taken back after 72 hours. Re-run the two gates that
      # read the tree the tarball is cut from, on the runner, before anything leaves it.
      - name: doctor (every theme + parity + authoring gates)
        run: node bin/geneseed-cli.mjs doctor --all
      # ⚠ GATED ON THE COUNT, NOT ON THE EXIT CODE, and here that matters more than anywhere
      # else in the repository: this is the last gate a tarball passes through and a published
      # version cannot be taken back after 72 hours. `node --test` over a glob that matches
      # NOTHING prints `# tests 0` and exits 0 — measured — so a file move could turn the only
      # test gate on the publish path into a green no-op with no diff to notice. The predecessor
      # here failed SAFE on an empty tree; this one has to be made to. The floor is deliberately
      # far below the real count: it separates "the suite ran" from "the suite was never found",
      # and is not a tally anyone has to maintain. `shell: bash` brings `pipefail`, so a red
      # suite still fails at the `node` line rather than at the count.
      #
      # ⚠ `--test-reporter=tap` IS THE GATE'S PREMISE, NOT A PREFERENCE. The count is read with
      # `awk '/^# tests /'`, and `# tests` is TAP's spelling. Node's DEFAULT reporter is not a
      # constant across majors: 22 emits TAP when stdout is a pipe, 24 emits `spec` — `ℹ tests
      # 1043` — through the same pipe. Measured on both, and the second was measured the
      # expensive way: this job pins Node 24 while the CI workflow pins 22, so a suite that was
      # green everywhere reported `0 tests` to this awk alone and failed the publish at the last
      # gate before the tarball. Same shape as the `npm pack --json` break one commit earlier —
      # this job runs a newer toolchain than CI, so it is where a default change lands first.
      # Pinning the reporter makes the gate read a format this repository chose rather than one
      # the runtime picks.
      - name: unit tests
        shell: bash
        run: |
          log="$(mktemp)"
          node --test --test-reporter=tap "tests/**/*.test.mjs" | tee "$log"
          n="$(awk '/^# tests /{n=$3} END{print n+0}' "$log")"
          echo "the suite reported $n tests"
          if [ "$n" -lt 500 ]; then
            echo "only $n tests were discovered — the glob has stopped matching the suite"
            exit 1
          fi

      # The same post-suite check the CI workflow runs, and for the same reason — see the comment
      # there. (Named in prose, not by filename: `the publish workflow references its own
      # filename` reads every `*.yml` token in this file and requires the set to be exactly this
      # one, because npm's trusted publisher is keyed on it.) An emit writes the machine-wide hook
      # shim at a path taken from the environment rather than from `--out`, so a test that emits
      # from a copied checkout can leave every install's hooks pointing at a deleted temp
      # directory — silently, since hooks return 0 on every path and the shim is excluded from the
      # byte corpora by name. AFTER the suite because `node --test` gives its files no ordering.
      #
      # Specific to a release as well: a run that left the shim naming a temp directory is a run
      # whose emits went somewhere nobody looked.
      - name: the suite left the machine-wide hook shim intact
        run: node tests/shim_intact.mjs

      # ⚠ ONE `run:` LINE WHOSE ARGUMENTS VARY — deliberately NOT a second, dry-run step.
      # `tests/unit/docs.test.mjs` ("the publish workflow publishes once") asserts that EXACTLY
      # one line in this file matches `run:.*npm publish`, so that a second publish path cannot
      # appear beside the guarded one. A rehearsal is therefore a FLAG on this line.
      #
      # `inputs.dry_run`, NOT `github.event.inputs.dry_run`: the latter is a STRING, so the
      # non-empty `'false'` is truthy and the guard would silently invert into a real publish on
      # the very run that asked to rehearse. The typed `inputs` context gives a real boolean.
      - name: publish
        run: npm publish ${{ inputs.dry_run && '--dry-run' || '' }}
