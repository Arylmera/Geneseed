name: ci

# Validate the harness on every push and PR: doctor (unresolved tokens, dead/
# non-hermetic links, theme-key parity, author-time spec/plugin gates, rendered-
# bundle sync) plus the Node test suites and the recorded corpus replays.
# Dependency-free — no install step. Runs on Linux AND Windows so native-Windows
# support stays green.
on:
  push:
  pull_request:
  # Kept for manual re-runs. It used to exist for one dispatch-guarded job, `record-corpus`,
  # which recorded the corpora from the reference implementation; that job is gone and no job is
  # guarded to this trigger any more, so a dispatch now runs exactly what a push runs.
  workflow_dispatch:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # ON BOTH OPERATING SYSTEMS, which is stronger than the gate this replaces: the same
      # sweep used to run here from the reference and, bare, from a Linux-only cell job.
      # The one Node test that drives `doctor --all` out of the checkout root is skipped when
      # `npm` is not on PATH, so it is not a gate this job can lean on — a conditional skip is
      # exactly the shape that turns a red gate green without a diff.
      - name: doctor (every theme + parity + authoring gates)
        run: node bin/geneseed-cli.mjs doctor --all
      # Auto-discover every tests/*.test.mjs (workflow runtime + plugins) — node
      # expands the glob itself, so a new test file is picked up without editing this
      # workflow. Needs Node >= 21.
      #
      # ⚠ GATED ON THE COUNT, NOT ON THE EXIT CODE. `node --test` over a glob that matches
      # NOTHING prints `# tests 0` and exits 0 — measured. An exit-code-only step would
      # therefore go green and silent the day a file move stops the glob matching, which is a
      # gate that fails OPEN. The floor is deliberately far below the real count: its job is to
      # separate "the suite ran" from "the suite was never found", not to be a tally anybody has
      # to maintain. `shell: bash` for the pipeline on both runners, and it brings `pipefail`
      # with it, so a red suite still fails at the `node` line rather than at the count.
      - name: node test suites (workflow runtime + plugins)
        shell: bash
        run: |
          log="$(mktemp)"
          node --test "tests/**/*.test.mjs" | tee "$log"
          n="$(awk '/^# tests /{n=$3} END{print n+0}' "$log")"
          echo "the suite reported $n tests"
          if [ "$n" -lt 500 ]; then
            echo "only $n tests were discovered — the glob has stopped matching the suite"
            exit 1
          fi

  # THE CELL HARNESSES — the whole cross-implementation gate, now that there is one
  # implementation. It replays the RECORDED corpus against the port; what it does not do is
  # compare two implementations, which needs two, and its predecessor did exactly that until
  # the second party was deleted. A live comparison and a corpus replay are different gates and
  # only the second one survives a deletion, which is why both ran side by side for a while.
  #
  # UBUNTU **AND** WINDOWS, which the comparison job never was: that one was Linux-only on a
  # runner budget, because it ran two implementations per cell. The budget argument does not
  # carry over — this replay is a single spawn per cell, so the whole emit matrix is ~70 seconds
  # rather than minutes. Every Windows defect this project has shipped — CRLF/LF, 8.3 short
  # paths, console flashes, cp1252 — was invisible to a Linux-only job, and the `crlf` half of
  # the corpus has no other replayer at all: a platform that has never run the gate is a
  # platform the gate says nothing about.
  node-cells:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The recorded corpus, replayed. `--against` resolves to `emit/crlf` or `emit/lf` from
      # this runner's line separator, so each half is replayed by the platform that recorded it.
      - name: golden — the recorded emit corpus, replayed
        run: node tests/golden.mjs --against tests/__snapshots__/emit
      # The two self-comparisons, which have no corpus and need none: they compare a run against
      # another run of the same implementation. `--idempotent` is the re-emit path real users
      # are on from their second build onwards; `--deletion` is the only thing that makes the
      # write-before-delete prune actually delete.
      - name: golden — idempotence
        run: node tests/golden.mjs --idempotent
      - name: golden — the prune
        run: node tests/golden.mjs --deletion
      # The CLI verb corpus — 317 cells over 25 verbs, and the ~800 absolute `expect_*`
      # assertions they carry inline. The absolute tier runs FIRST against the candidate, so a
      # cell that has stopped exercising what it names is reported VACUOUS rather than compared:
      # a corpus recorded from an implementation that had gone silent would otherwise say
      # nothing, green, forever.
      #
      # This job also asserts the PLATFORM UNION from either host — every id declared for this
      # platform is built, every id declared for the other is absent, neither half empty — and
      # PRINTS the half it did not run, so a run says out loud what it skipped.
      - name: cli_golden — the recorded CLI corpus, replayed
        run: node tests/cli_golden.mjs --against tests/__snapshots__/cli
      # The web console corpus — 114 cells, each a request script over one reused connection
      # against a daemon started with `--daemon-internal --port 0`.
      #
      # BOTH ENTRIES, because a second driver does not inherit the first's proof: `js/web/
      # server.mjs` is the daemon's own entry and `bin/geneseed-cli.mjs web` is the CLI's. That
      # was P4a's finding and it matters most here, since a corpus replay is the only one of the
      # two gates that survives the reference.
      - name: web_golden — the recorded web corpus, replayed from both entries
        run: |
          node tests/web_golden.mjs --against tests/__snapshots__/web --cli "node js/web/server.mjs"
          node tests/web_golden.mjs --against tests/__snapshots__/web --cli "node bin/geneseed-cli.mjs web"

  # THE LINUX CORPUS RECORDER LIVED HERE, AND IT IS GONE ON PURPOSE.
  #
  # This job was `workflow_dispatch`-only. It ran the reference implementation with `--record`
  # to produce the `lf` halves of the emit, cli and web corpora, the posix half of the
  # primitives corpus, and the posix cell matrices. It recorded AND replayed in the same run,
  # which is what made a green dispatch mean the artifact was worth committing.
  #
  # It was dispatched for the last time on 2026-08-17, against the commit immediately before
  # its own deletion, and its artifact IS the `lf` half committed alongside it. It was deleted
  # first so it could not outlive the reference that drives it — every recorder and every
  # comparison harness went in the same cut. A dispatch button that silently produces nothing
  # is worse than no button at all.
  #
  # THE CORPUS IS NOW REPLAY-ONLY, ON BOTH PLATFORMS. The Node replayers reject `--record` by
  # design and nothing else has ever written a cell. A change that moves a recorded byte is a
  # FINDING, NOT A STEP: revert it, or argue in writing that the recording was wrong -- and
  # nothing can settle that argument any more. The port's own limits doc records what each
  # platform's run does and does not reach.
  #
  # To see what an oracle would have said, check out the tag `python-reference-v1.0.0`. Its
  # message carries the exact re-record commands and which platform each half comes from.

  # THE PACKAGED TARBALL, ON A MACHINE THAT HAS NO INTERPRETER AT ALL.
  #
  # Every other job here runs the CHECKOUT on a runner that happens to ship Python. This one
  # runs the ARTEFACT on a filesystem where there is no python, python3 or py to find — which is
  # the only way to prove the claim the deletion actually makes. A stripped PATH cannot: it shows
  # the CLI does not shell out to an interpreter it NAMES, and says nothing about one reached by
  # a shebang, an import, or a probe of a well-known install directory.
  #
  # It is also the only job that installs the tarball rather than reading the repo, so it is the
  # one that would notice a file `files[]` forgets to ship.
  #
  # `container:` rather than a `docker run` inside the job: the steps then execute IN the image,
  # so the absence is a property of the machine running the commands and not of a nested
  # sandbox. The probe runs TWICE — before and after apt installs git — because an interpreter
  # arriving as somebody's transitive dependency is exactly the kind of thing this gate exists
  # to notice, and it would otherwise be invisible.
  #
  # FAILURE IS WIDER THAN A NON-ZERO EXIT, deliberately: any ENOENT (what spawning a missing
  # interpreter looks like), or the string `python` anywhere in the output, because a message
  # naming an interpreter this machine does not have is a lie whether the command succeeded or
  # not. tests/helpers/no-python-container.sh is the same gate for a laptop with a docker daemon.
  package-no-python:
    runs-on: ubuntu-latest
    container: node:22-slim
    steps:
      - name: the image really has no interpreter
        run: |
          for p in python python3 py; do
            if command -v $p; then echo "REFUSING: the image ships $p, so this gate proves nothing"; exit 2; fi
          done
          echo "no python, python3 or py on PATH — the gate is meaningful here"
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates
      - name: still no interpreter, after apt
        run: |
          for p in python python3 py; do
            if command -v $p; then echo "FAIL: installing git dragged in $p"; exit 1; fi
          done
      - uses: actions/checkout@v4
      # ⚠ `shell: bash` on every step that needs more than POSIX sh. A `container:` job defaults to
      # `sh -e`, where `set -o pipefail` is an ILLEGAL OPTION and the step dies before it reaches
      # anything worth testing — which is exactly how this gate first failed. Debian slim ships
      # bash; naming it is cheaper than writing to the sh subset.
      - name: pack, install into a throwaway consumer, and exercise it
        shell: bash
        run: |
          set -o pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          TARBALL=$(npm pack --silent | tail -1)
          echo "packed: $TARBALL"
          mkdir -p /consumer && cd /consumer && npm init -y >/dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/$TARBALL"
          mkdir -p /work && cd /work && git init -q
          # The daemon is backgrounded by PID rather than by `%1`: job control is off in a
          # non-interactive shell, so `kill %1` is unreliable exactly where it matters.
          {
            npx geneseed --version
            npx geneseed doctor --all
            npx geneseed-build --emit claude
            npx geneseed status
            npx geneseed catalog
            npx geneseed web --daemon-internal --port 0 &
            web_pid=$!
            sleep 3
            kill "$web_pid" 2>/dev/null || true
            wait "$web_pid" 2>/dev/null || true
          } 2>&1 | tee /tmp/acceptance.log
          echo "--acceptance-done--" >> /tmp/acceptance.log
      - name: no ENOENT, and the word never appears
        shell: bash
        run: |
          if grep -qi 'ENOENT' /tmp/acceptance.log; then
            echo "FAIL: an ENOENT — something spawned a program this machine does not have"
            grep -i 'ENOENT' /tmp/acceptance.log | head; exit 1
          fi
          if grep -qi 'python' /tmp/acceptance.log; then
            echo "FAIL: 'python' appeared in the output of a machine with no interpreter"
            grep -i 'python' /tmp/acceptance.log | head; exit 1
          fi
          echo "PASS: builds, wires, doctors and serves with no interpreter present"

  # The web UI (web/) is a Vite/React app with its own toolchain, so it gets a
  # dedicated job: lint, format check, unit tests, and a production build. Linux
  # only — it is platform-independent, unlike the harness CLI above.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: lint
        run: npm run lint
      - name: format check
        run: npm run format:check
      - name: unit tests
        run: npm test
      - name: production build
        run: npm run build
      - name: dist is fresh
        # web/dist is TRACKED and hand-committed, and it is in package.json's files[]. A
        # web/src change that was never rebuilt ships a console that does not match its
        # source: the daemon serves stale code, then fails hard on MIME after the next
        # rebuild. `npm run build` above is a compile check; this is the freshness check.
        # Run from the repo root, because dist lives outside this job's working-directory.
        #
        # TWO COMMANDS, BECAUSE `git diff` CANNOT SEE AN UNTRACKED FILE. Vite names every
        # chunk with a content hash, so a source change that adds or renames a lazy chunk
        # writes a file git has never heard of — and `git diff` reports only tracked paths, so
        # that build passed this gate. It was caught indirectly at best, via whichever tracked
        # chunk happened to reference the new name. `git status --porcelain` lists untracked
        # paths (`??`) as well as modified ones, so the second command is the assertion the
        # comment above actually claims. Both run: `git diff` names WHAT changed in a
        # reviewable form, the status check is what makes the gate complete.
        working-directory: .
        run: |
          git diff --exit-code --stat -- web/dist
          drift="$(git status --porcelain -- web/dist)"
          if [ -n "$drift" ]; then
            echo "web/dist is not what web/src builds to — rebuild and commit:"
            echo "$drift"
            exit 1
          fi
