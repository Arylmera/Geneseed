name: mutate

# THE MUTATION MATRIX, WEEKLY. `tests/mutate.mjs --all` applies each of its one-string product
# edits in turn and requires a gate to go red for every one — the only check that the suite can
# still SEE the faults it claims to catch. CI runs only `--verify` (the anchors resolve), because
# the full run takes minutes and an interrupted local run leaves the tree mutated. A runner's
# checkout is thrown away, so neither cost applies here.
on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: every mutation is caught
        run: node tests/mutate.mjs --all
