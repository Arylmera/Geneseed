name: mutate

# THE MUTATION MATRIX, WEEKLY. `tests/mutate.mjs --all` applies each of its one-string product
# edits in turn and requires a gate to go red for every one — the only check that the suite can
# still SEE the faults it claims to catch. CI runs only `--verify` (the anchors resolve), because
# the full run takes minutes and an interrupted local run leaves the tree mutated. A runner's
# checkout is thrown away, so neither cost applies here.
on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ON WINDOWS, BECAUSE TWO ROWS CAN ONLY DIE THERE. M1 (writeText's os.linesep translation) and
  # M11 (the sandbox's 8.3-short-name temp root) model Windows defects: on Linux the line
  # separator is already \n and TEMP has no short names, so both mutants are equivalent and
  # SURVIVE — which is why every scheduled run on ubuntu-latest was red (2026-09-28, 2026-10-05).
  # Both are killed on Windows (checked locally with `--only M1` / `--only M11`). Every other row
  # is platform-neutral, so one Windows run covers the whole matrix.
  mutate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      # devDependencies: the control run is the whole unit glob, and since #213 one file in it
      # (jsonc_properties.test.mjs) imports fast-check. Without this the control is red and the
      # matrix refuses to run — which is how the first Monday after #213 would have failed.
      - run: npm ci
      - name: every mutation is caught
        run: node tests/mutate.mjs --all

  # GENERATED MUTANTS, ON THE PARSER THAT REWRITES A USER'S SETTINGS. The matrix above is 33
  # hand-picked faults across the product; Stryker generates every operator-level mutant of
  # `readJsonc` (stryker.config.json) and runs the settings tests against each — first reading
  # 2026-10-08: 84.5 % (120 of 142 killed or timed out; most survivors are equivalent bounds
  # checks). A report, not a gate: no `thresholds.break`, so a dip shows in the log and the
  # summary without turning the Monday run red.
  stryker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: stryker on readJsonc
        run: npx stryker run --reporters clear-text,progress
