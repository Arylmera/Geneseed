name: upstream-drift

# Has anything we CITE changed upstream since the commit `src/upstreams.json` pins? One issue
# per drifted key (label `upstream-drift`), closed again when the key is clean. See
# tests/upstream_drift.mjs. Not part of ci.yml: it calls the GitHub API and a PR's verdict
# should not depend on that.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: report and sync drift issues
        run: node tests/upstream_drift.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
