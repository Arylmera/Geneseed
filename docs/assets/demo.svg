<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="geneseed setup, then two laws catching a force-push and a credential at the tool boundary">
<title>geneseed setup, then two laws catching a force-push and a credential at the tool boundary</title>
<style>
text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:13px;white-space:pre}
.c{fill:#E8EEF2}.d{fill:#8A97A3}.k{fill:#3AD4C4}.x{fill:#F2695C}.i{fill:#8A97A3;font-style:italic}
@media (prefers-reduced-motion:no-preference){
.l{opacity:0;animation:in .05s linear forwards}
.t0{animation-delay:0.4s}.t1{animation-delay:1.4s}.t2{animation-delay:1.8s}.t3{animation-delay:2.6s}.t4{animation-delay:3.4s}.t5{animation-delay:4.2s}.t6{animation-delay:5.2s}.t7{animation-delay:6s}.t8{animation-delay:6.8s}.t9{animation-delay:8s}.t10{animation-delay:8.8s}.t11{animation-delay:10s}
.bl{animation:bl 1.1s steps(1) infinite}
@keyframes in{to{opacity:1}}
@keyframes bl{50%{opacity:0}}
}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#11161C"/><stop offset="1" stop-color="#0C0E11"/></linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1" fill="#303C49"/></pattern>
<radialGradient id="fade" cx="0.85" cy="0.15" r="0.6"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<mask id="mk"><rect width="760" height="420" fill="url(#fade)"/></mask>
</defs>
<rect x=".5" y=".5" width="759" height="419" rx="16" fill="url(#bg)" stroke="#1E2630"/>
<rect width="760" height="420" fill="url(#dots)" mask="url(#mk)"/>

<path d="M1,34h758" stroke="#1E2630"/>
<g fill="none" stroke="#8A97A3" opacity=".8"><circle cx="38" cy="18" r="4"/><circle cx="54" cy="18" r="4"/><circle cx="70" cy="18" r="4"/></g>
<text x="380" y="22" text-anchor="middle" class="d" style="font-size:12px">geneseed — one source, five targets</text>
<text xml:space="preserve" x="26" y="62" class="l c t0"><tspan fill="#3AD4C4">$</tspan> npx geneseed setup</text>
<text xml:space="preserve" x="26" y="82" class="l d t1">  theme ........ neutral</text>
<text xml:space="preserve" x="26" y="102" class="l d t2">  install ...... opencode-global   (every repo inherits it)</text>
<text xml:space="preserve" x="26" y="122" class="l k t3">  ✓ built  ·  laws · agents · skills  ·  gates armed</text>
<text xml:space="preserve" x="26" y="162" class="l c t4"><tspan fill="#3AD4C4">$</tspan> geneseed doctor</text>
<text xml:space="preserve" x="26" y="182" class="l k t5">  [doctor] ok — 1 theme(s) clean: no unresolved tokens, no dead links, …</text>
<text xml:space="preserve" x="26" y="222" class="l i t6"># later, in any repo — the agent reaches for:</text>
<text xml:space="preserve" x="26" y="242" class="l c t7"><tspan fill="#3AD4C4">&gt;</tspan> git push --force origin main</text>
<text xml:space="preserve" x="26" y="262" class="l x t8">  This command force-pushes the protected branch main on the remote.</text>
<text xml:space="preserve" x="26" y="282" class="l d t8">  Safe choice: Deny, then push without --force. (Deletion Is Deliberate)</text>
<text xml:space="preserve" x="26" y="322" class="l c t9"><tspan fill="#3AD4C4">&gt;</tspan> Write config.js   const key = &quot;sk-ant-api03-…&quot;</text>
<text xml:space="preserve" x="26" y="342" class="l x t10">  This edit puts a credential-shaped string in config.js.</text>
<text xml:space="preserve" x="26" y="362" class="l d t10">  Safe choice: Deny, then keep the value in .env or a secret manager. (Sealed Secrets)</text>
<text xml:space="preserve" x="26" y="402" class="l d t11">  one source · five targets · the rules hold at the tool boundary</text>
<rect class="bl" x="26" y="391" width="8" height="14" fill="#3AD4C4"/>
</svg>
